[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aevum-cost"
version = "0.1.0"
description = "Real GPU cost per image / per video second, self-host vs API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aevum-cost = "aevum_cost.cli:main"

[project.urls]
Homepage = "https://aevum.ai?utm_source=cost"
Repository = "https://github.com/aevum-ai/aevum-cost"

[tool.setuptools.packages.find]
include = ["aevum_cost*"]
